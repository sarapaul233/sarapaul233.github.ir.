<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini LLM Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-card { background: #fff; width: 100%; max-width: 650px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; height: 80vh; }
        .header { padding: 16px 20px; border-bottom: 1px solid #eee; background: #2563eb; color: #fff; border-radius: 12px 12px 0 0; }
        .config-bar { padding: 12px 20px; background: #f8fafc; border-bottom: 1px solid #eee; display: flex; gap: 10px; }
        .config-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
        .assistant { align-self: flex-start; background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 2px; }
        .input-bar { padding: 16px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        textarea { flex: 1; resize: none; height: 44px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        button { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="header">
        <h2>Gemini AI Assistant</h2>
    </div>
    
    <div class="config-bar">
        <input type="password" id="apiKey" placeholder="Enter your Gemini API Key here">
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message assistant">Hello! Enter your API key above to start chatting.</div>
    </div>

    <div class="input-bar">
        <textarea id="userInput" placeholder="Type your message..."></textarea>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');

        const messageText = userInput.value.trim();
        if (!messageText) return;

        if (!apiKey) {
            alert('Please enter a valid Gemini API key.');
            return;
        }

        // Display User Message
        appendMessage(messageText, 'user');
        userInput.value = '';
        sendBtn.disabled = true;

        // Display Loading Placeholder
        const loadingDiv = appendMessage('Thinking...', 'assistant');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: messageText }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                loadingDiv.innerText = `Error: ${data.error.message}`;
            } else {
                const reply = data.candidates[0].content.parts[0].text;
                loadingDiv.innerText = reply;
            }
        } catch (err) {
            loadingDiv.innerText = 'Failed to fetch response. Please check your network connection or API key.';
        } finally {
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }
</script>

</body>
</html>
